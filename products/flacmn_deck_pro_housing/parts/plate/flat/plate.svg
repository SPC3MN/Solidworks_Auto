.sk .edge{fill:none;stroke:var(--sk-fg);stroke-width:2.6;stroke-linejoin:round}
.sk .cutedge{fill:none;stroke:var(--sk-fg);stroke-width:1.3}
.sk .ol{stroke:var(--sk-fg);stroke-width:1.1;fill-opacity:.14}
