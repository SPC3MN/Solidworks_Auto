.sk .perf{fill:none;stroke:var(--sk-lp);stroke-width:1.6;stroke-linecap:round}
.sk .fl{fill:#3f6fc4;font-size:10.5px}
.sk .warn{fill:var(--sk-lp);font-weight:700}
</style>
